<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bán Hàng - Đăng Nhập</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="min-h-screen">
            <div class="main-content">
                <div class="content-wrapper">
                    <div class="header-section">
                        <h1 class="heading-1">Đăng nhập</h1>
                        <p class="subtitle">Hệ thống quản lý bán hàng</p>
                    </div>

                    <div class="grid-layout">
                        <div class="intro-section">
                            <h2 class="heading-2">Hệ thống quản lý bán hàng</h2>
                            <p class="intro-text">
                                Đây là giải pháp quản lý bán hàng hoàn hảo cho cửa hàng của bạn. 
                                Theo dõi sản phẩm, đơn hàng và khách hàng một cách dễ dàng.
                            </p>
                        </div>

                        <div class="login-form">
                            <div class="form-group">
                                <input type="text" id="email" class="form-input" placeholder=" " required/>
                                <label for="email" class="form-label">Email</label>
                            </div>

                            <div class="form-group">
                                <input type="password" id="password" class="form-input" placeholder=" " required/>
                                <label for="password" class="form-label">Mật khẩu</label>
                            </div>

                            <p id="message" style="color: red;"></p>

                            <button onclick="signIn()" class="main-button">
                                Đăng nhập
                            </button>

                            <div class="divider-section">
                                <div class="divider-content">
                                    <h3>Hoặc</h3>
                                    <button onclick="googleSignIn()" class="button-gg">
                                        <img src="asset/google-logo.svg" alt="Google Logo" class="google-logo">
                                        <span>Đăng nhập với Google</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboard" style="display: none; margin: 20px;">
        <h2>Chào mừng! Bạn đã đăng nhập thành công.</h2>
        <button onclick="signOut()">Đăng Xuất</button>
    </div>

    <!-- Firebase SDK (phiên bản mới nhất 2025) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>

</html>
